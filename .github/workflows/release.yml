name: Release

on:
  push:
    branches:
      - allow_direct_download
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: 
      - ubuntu-latest
      - ${{ matrix.arch == 'amd64' && 'x64' || matrix.arch }}
    strategy:
      matrix:
        go-version: ['stable']
        os: [darwin, linux]
        arch: [amd64, arm64]
    steps:
    - uses: actions/checkout@v4
    - name: Install Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Run build
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
      run: |
        go build -o go-cache-plugin.${{ matrix.os }}-${{ matrix.arch }} ./cmd/go-cache-plugin/...
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: go-cache-plugin-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          go-cache-plugin.${{ matrix.os }}-${{ matrix.arch }}
        if-no-files-found: ignore
        retention-days: 1

  makeRelease:
    runs-on:
      - linux
    permissions: write-all
    needs:
      - build 
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: go-cache-plugin
      - name: Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda #v2.2.1
        with:
          tag_name: go-cache-plugin-v${{ github.run_number }}
          name: go-cache-plugin v${{ github.run_number }}
          body: |
            go-cache-plugin v${{ github.run_number }}
          files: |
            go-cache-plugin/**
